spring.application.name=order-service
server.port=4006
logging.level.root=info

# Kafka Producer (for notification events)
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

order.payment.service.address=${ORDER_PAYMENT_SERVICE_ADDRESS:payment-service}
order.payment.service.grpc.port=${ORDER_PAYMENT_SERVICE_GRPC_PORT:9002}
order.payment.service.grpc.deadline-ms=${ORDER_PAYMENT_SERVICE_GRPC_DEADLINE_MS:8000}
order.payment.service.grpc.refund-deadline-ms=${ORDER_PAYMENT_SERVICE_GRPC_REFUND_DEADLINE_MS:8000}
stock.service.grpc.address=${STOCK_SERVICE_GRPC_ADDRESS:stock-service}
stock.service.grpc.port=${STOCK_SERVICE_GRPC_PORT:9003}
stock.service.grpc.deadline-ms=${STOCK_SERVICE_GRPC_DEADLINE_MS:5000}
tradepulse.kafka.topics.orders=${TRADEPULSE_KAFKA_TOPIC_ORDERS:tradepulse.orders.events}
tradepulse.kafka.topics.notifications=${TRADEPULSE_KAFKA_TOPIC_NOTIFICATIONS:tradepulse.notifications.events}

# Outbox relay: poll interval in ms (default 3 s)
tradepulse.outbox.relay.fixed-delay-ms=${TRADEPULSE_OUTBOX_RELAY_DELAY_MS:3000}

# Connection Pool Optimization
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-timeout=20000

# Batch Operations
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Query Timeout
spring.jpa.properties.hibernate.jdbc.query.timeout=30

# Statement caching
spring.datasource.hikari.data-source-properties.preparedStatementCacheSize=250
spring.datasource.hikari.data-source-properties.preparedStatementCacheSqlLimit=2048
