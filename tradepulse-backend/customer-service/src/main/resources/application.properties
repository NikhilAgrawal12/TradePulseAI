spring.application.name=customer-service

logging.level.root=info
server.port=4000

# Run data.sql before Hibernate so schema migrations happen first
spring.jpa.defer-datasource-initialization=true

# Shared secret for trusted internal auth-service compensation calls
auth.service.internal-api-key=${AUTH_INTERNAL_API_KEY:}

spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
tradepulse.kafka.topics.notifications=${TRADEPULSE_KAFKA_TOPIC_NOTIFICATIONS:tradepulse.notifications.events}

auth.service.base-url=${AUTH_SERVICE_BASE_URL:http://auth-service:4005}
wallet.service.base-url=${WALLET_SERVICE_BASE_URL:http://payment-service:4001}
portfolio.service.base-url=${PORTFOLIO_SERVICE_BASE_URL:http://portfolio-service:4007}
order.service.base-url=${ORDER_SERVICE_BASE_URL:http://order-service:4006}

# Connection Pool Optimization (HikariCP)
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-timeout=20000

# Batch Operations Optimization
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# Query Timeout
spring.jpa.properties.hibernate.jdbc.query.timeout=30

# Statement caching
spring.datasource.hikari.data-source-properties.preparedStatementCacheSize=250
spring.datasource.hikari.data-source-properties.preparedStatementCacheSqlLimit=2048
