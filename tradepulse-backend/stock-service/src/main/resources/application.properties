spring.application.name=stock-service
server.port=4003
grpc.server.port=${GRPC_SERVER_PORT:9003}
logging.level.root=info
logging.level.com.tradepulse.stockservice.service.FeaturedStockSSEService=debug

# Tomcat Thread Pool Configuration for handling concurrent requests
server.tomcat.threads.max=400
server.tomcat.threads.min-spare=20
server.tomcat.max-connections=600
server.tomcat.accept-count=150
server.tomcat.connection-timeout=30000
server.tomcat.keep-alive-timeout=30000

# SSE Configuration
server.servlet.session.timeout=30m

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Ensure JPA creates/updates tables before data.sql seeding executes.
spring.jpa.defer-datasource-initialization=true

# Connection Pool Optimization (HikariCP)
spring.datasource.hikari.pool-name=StockServiceHikariPool
spring.datasource.hikari.maximum-pool-size=40
spring.datasource.hikari.minimum-idle=8
spring.datasource.hikari.idle-timeout=180000
spring.datasource.hikari.max-lifetime=900000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=2000
spring.datasource.hikari.leak-detection-threshold=20000
spring.datasource.hikari.initialization-fail-timeout=1
spring.datasource.hikari.register-mbeans=true
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.auto-commit=true

# Batch Operations Optimization
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# Query Timeout (prevents hanging queries)
spring.jpa.properties.hibernate.jdbc.query.timeout=30

# Statement caching (reduces parsing overhead)
spring.datasource.hikari.data-source-properties.preparedStatementCacheSize=250
spring.datasource.hikari.data-source-properties.preparedStatementCacheSqlLimit=2048

massive.api.base-url=https://api.massive.com
massive.api.key=${MASSIVE_API_KEY:}
massive.exchanges.sync-on-startup=false
massive.stocks.sync-on-startup=false
massive.stocks.target-count=800
massive.featured.daily-refresh-enabled=true
massive.featured.target-count=50

# Operational telemetry
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.db.enabled=true
management.metrics.tags.application=${spring.application.name}

